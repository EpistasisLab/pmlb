dataset: iris
description: 'Fisher iris measurements: 150 flowers, four sepal/petal measurements
  in centimetres, and three species. Values and encoded targets were verified against
  the UCI iris.data release.'
source: https://archive.ics.uci.edu/dataset/53/iris
publication: https://doi.org/10.1111/j.1469-1809.1936.tb02137.x
task: classification
keywords:
  - botany
  - classification
target:
  type: categorical
  description: Iris species
  code: 0 = Iris-setosa; 1 = Iris-versicolor; 2 = Iris-virginica
features:
  - name: sepal-length
    type: continuous
    description: sepal length in centimetres
  - name: sepal-width
    type: continuous
    description: sepal width in centimetres
  - name: petal-length
    type: continuous
    description: petal length in centimetres
  - name: petal-width
    type: continuous
    description: petal width in centimetres
